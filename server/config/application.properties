spring.message.encoding=UTF-8
server.port=8881

# h2适合开发使用，上线时请切换到mysql。切换时把下面h2部分配置注释掉，打开mysql部署配置。
##*********************** h2 DB begin ***************************
#spring.datasource.url=jdbc:h2:file:./daily_report;AUTO_SERVER=TRUE;MODE=MySQL
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver
#spring.jpa.database=h2
#spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode=always
##spring.sql.init.mode为always时，每次启动都会初始化resource目录下的data.sql日志，所以需要spring.sql.init.continue-on-error继续执行。
##如果上线，需要spring.sql.init.mode为false，然后手动初始化数据。
#spring.sql.init.continue-on-error=true
#spring.jpa.hibernate.ddl-auto=update
##*********************** h2 DB end ******************************

# mysql默认配置
# mysql需要手动创建数据库，mysql命令行下执行 create database application_server;
##*********************** mysql DB begin *************************
spring.datasource.url=jdbc:mysql://localhost:3306/daily_report?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database=mysql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
##spring.sql.init.mode为always时，每次启动都会初始化resource目录下的data.sql日志，所以需要spring.sql.init.continue-on-error继续执行。
##如果上线，需要spring.sql.init.mode为false，然后手动初始化数据。
spring.sql.init.continue-on-error=true
spring.jpa.hibernate.ddl-auto=update
##*********************** mysql DB end ***************************

# 是否支持SSL，如果所有客户端调用appserver都支持https，请把下面开关设置为true，否则为false。
# 如果为false，在Web端和wx端的appserve的群公告等功能将不可用。
# 详情请参考 https://www.baidu.com/s?wd=cookie+SameSite&ie=utf-8
wfc.all_client_support_ssl=false

# IM服务地址，注意端口是80，不是管理API的18080.
im.url=http://192.168.1.87
# 应用ID
application.id=c297a1e2-a7b8-4ca0-bd56-7d4e71a5a072
# 应用密钥
application.secret=8713bfb9-0bb4-4726-ae29-70c5a873f010

# 日报页面访问地址，用于生成野火通知中的详情链接，末尾不要带 /。
report.base-url=http://192.168.1.87:8881
# 本地联调可设为 false，避免向真实用户发送测试消息。
report.notification-enabled=true
# 通知线程池使用有界队列，队列满时由提交线程执行以限制积压。
report.notification.core-pool-size=4
report.notification.max-pool-size=8
report.notification.queue-capacity=1000

# 与 Shiro 的 Ant 路径匹配保持一致，缓解 Shiro/Spring 路径匹配差异导致的认证绕过。
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# 限制请求体大小，降低超大 JSON/表单造成的资源消耗。
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# CORS 允许的来源，逗号分隔；为空时仅允许同源。生产环境请填写明确的协议+域名+端口。
cors.allowed-origins=

# 允许嵌入本应用的父页面来源（CSP frame-ancestors），多个值用空格分隔。
# 例如野火 Web 工作台为 https://im.example.com，则配置为：'self' https://im.example.com
security.frame-ancestors='self'
